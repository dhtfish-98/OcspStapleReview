[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "cvp-ocsp-staple-review"
version = "0.1.4"
authors = [{name = "dhtfish98"}]
description = "Offline RFC 6960 single-response signature, issuer/serial binding, responder authorization, nonce and freshness verification with a pinned direct issuer."
requires-python = ">=3.11"
license = "MIT"
license-files = ["项目文档/LICENSE", "项目文档/UPSTREAM_LICENSE"]
readme = "项目文档/README.md"
dependencies = ["cryptography==50.0.2", "PyNaCl==1.6.2"]
[project.scripts]
ocsp-staple-review = "ocsp_staple_review.cli:entry"
[tool.setuptools.packages.find]
where = ["src"]
